<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Portal Pengalihan Resmi</title>
    <style>
        /* Desain halaman tunggu sederhana & profesional */
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
            background-color: #f4f7f6;
            color: #333;
            text-align: center;
            padding: 20px;
        }
        .container {
            max-width: 400px;
            padding: 30px;
            background: white;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.05);
        }
        .spinner {
            border: 4px solid #f3f3f3;
            border-top: 4px solid #3498db;
            border-radius: 50%;
            width: 40px;
            height: 40px;
            animation: spin 1s linear infinite;
            margin: 0 auto 20px auto;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        h1 { font-size: 1.4rem; margin-bottom: 10px; color: #2c3e50; }
        p { font-size: 0.95rem; color: #7f8c8d; line-height: 1.5; }
        .btn {
            display: inline-block;
            margin-top: 15px;
            padding: 10px 20px;
            background-color: #3498db;
            color: white;
            text-decoration: none;
            border-radius: 6px;
            font-size: 0.9rem;
        }
    </style>

    <script>
        // === 🔧 PENGATURAN URL UTAMA ===
        // Ganti tanda pagar (#) dengan URL website utama jika nanti sudah jadi (contoh: "https://google.com")
        const WEBSITE_UTAMA = "#"; 

        // Sistem Auto-Redirect Pintar
        window.onload = function() {
            // Jika URL utama masih tanda pagar (#), sistem tidak akan mengalihkan (mencegah error)
            if (WEBSITE_UTAMA !== "#" && WEBSITE_UTAMA !== "") {
                setTimeout(function() {
                    window.location.href = WEBSITE_UTAMA;
                }, 1000); // Mengalihkan otomatis setelah 1 detik
            } else {
                // Jika web utama belum siap, ubah teks tampilan halaman tunggu
                document.getElementById("status-text").innerText = "Website utama kami sedang dipersiapkan. Silakan pindai kembali beberapa saat lagi.";
                document.getElementById("loading-icon").style.display = "none";
                document.getElementById("backup-link").style.display = "none";
            }
        };
    </script>
</head>
<body>

    <div class="container">
        <div class="spinner" id="loading-icon"></div>
        <h1 id="title-text">Menuju Halaman Utama</h1>
        <p id="status-text">Mohon tunggu sebentar, Anda sedang dialihkan secara otomatis...</p>
        <a id="backup-link" class="btn" href="#">Klik di Sini Jika Tidak Otomatis</a>
    </div>

    <script>
        // Memasang link cadangan pada tombol jika URL sudah diisi
        if (WEBSITE_UTAMA !== "#" && WEBSITE_UTAMA !== "") {
            document.getElementById("backup-link").href = WEBSITE_UTAMA;
        }
    </script>
</body>
</html>
