<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Portal Resmi</title>
    <style>
        /* Desain Tanpa Box, Fokus pada Logo dan Teks Minimalis */
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
            background-color: #f8f9fa; /* Latar belakang bersih neutral */
            color: #2c3e50;
            text-align: center;
            padding: 24px;
            box-sizing: border-box;
        }

        .portal-wrapper {
            display: flex;
            flex-direction: column;
            align-items: center;
            max-width: 500px;
            width: 100%;
        }

        /* Pengaturan Logo Baru: Lebih Besar & Profesional */
        .logo-pribadi {
            width: 100%;
            max-width: 220px; /* Ukuran logo dioptimalkan agar proporsional */
            height: auto;
            margin-bottom: 28px;
            display: block;
            object-fit: contain;
        }

        /* Loading Spinner Halus */
        .spinner {
            border: 3px solid rgba(0, 0, 0, 0.05);
            border-top: 3px solid #2c3e50; /* Warna senada dengan teks */
            border-radius: 50%;
            width: 28px;
            height: 28px;
            animation: spin 0.8s linear infinite;
            margin-bottom: 20px;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        h1 { 
            font-size: 1.3rem; 
            font-weight: 600;
            margin: 0 0 8px 0; 
            color: #1a252f; 
        }

        p { 
            font-size: 0.95rem; 
            color: #7f8c8d; 
            line-height: 1.6;
            margin: 0;
            max-width: 320px;
        }

        .btn {
            display: inline-block;
            margin-top: 24px;
            padding: 10px 24px;
            background-color: #2c3e50;
            color: white;
            text-decoration: none;
            border-radius: 20px; /* Gaya kapsul modern */
            font-size: 0.85rem;
            font-weight: 500;
            transition: opacity 0.2s ease;
        }
        .btn:hover {
            opacity: 0.9;
        }
    </style>

    <script>
        // === 🔧 PENGATURAN URL UTAMA ===
        const WEBSITE_UTAMA = "https://drive.google.com/drive/folders/13kwddS2uMZ9ihUyk8pMwLVc3A54XpcHe?usp=sharing"; 

        window.onload = function() {
            if (WEBSITE_UTAMA !== "#" && WEBSITE_UTAMA !== "") {
                setTimeout(function() {
                    window.location.href = WEBSITE_UTAMA;
                }, 1000); 
            } else {
                document.getElementById("status-text").innerText = "Website sedang dipersiapkan.";
                document.getElementById("loading-icon").style.display = "none";
                document.getElementById("backup-link").style.display = "none";
            }
        };
    </script>
</head>
<body>

    <div class="portal-wrapper">
        <!-- Pastikan nama file gambar di bawah ini sama dengan yang Anda upload di GitHub -->
        <img src="LogoTunggu.png" alt="Logo Resmi" class="logo-pribadi">
        
        <div class="spinner" id="loading-icon"></div>
        <h1 id="title-text">Menuju Halaman Utama</h1>
        <p id="status-text">Mohon tunggu sebentar, Anda sedang dialihkan secara otomatis...</p>
        
        <a id="backup-link" class="btn" href="#">Klik di Sini Jika Tidak Otomatis</a>
    </div>

    <script>
        if (WEBSITE_UTAMA !== "#" && WEBSITE_UTAMA !== "") {
            document.getElementById("backup-link").href = WEBSITE_UTAMA;
        }
    </script>
</body>
</html>
